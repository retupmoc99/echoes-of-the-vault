# Netlify: connect the repo (or drag dist/ onto app.netlify.com/drop).
[build]
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The service worker and manifest must never be cached long, or phones
# would keep running an old version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed build files never change: cache them for a year.
[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
